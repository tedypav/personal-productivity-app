repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: []

  - repo: local
    hooks:
      - id: docs-sync-check
        name: Documentation sync check
        entry: py scripts/check_docs_sync.py
        language: system
        pass_filenames: false
        always_run: true
      - id: code-health-check
        name: Code health check
        entry: py scripts/check_code_health.py
        language: system
        pass_filenames: false
        always_run: true