<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F5"/>
      <stop offset="1" stop-color="#FFF3F8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y2="1">
      <stop offset="0" stop-color="#CFA6D6"/>
      <stop offset="1" stop-color="#F7D1DC"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7D1DC"/>
      <stop offset="1" stop-color="#FFD8C2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2E2B2B" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#bgGrad)" stroke="#F0E6E8" stroke-width="1" filter="url(#softShadow)"/>

  <!-- P letter stylized -->
  <text x="36" y="82" font-family="Playfair Display, Georgia, serif" font-weight="600" font-size="52" fill="#2E2B2B" opacity="0.85">p</text>

  <!-- Small heart accent -->
  <g transform="translate(82, 28) scale(0.25)">
    <path d="M 50 88 C 25 88 0 63 0 40 C 0 15 25 0 50 25 C 75 0 100 15 100 40 C 100 63 75 88 50 88 Z" fill="url(#heartGrad)" opacity="0.8"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="38" cy="95" r="2" fill="#CFA6D6" opacity="0.5"/>
  <circle cx="48" cy="95" r="2" fill="#F7D1DC" opacity="0.5"/>
  <circle cx="58" cy="95" r="2" fill="#FFD8C2" opacity="0.5"/>
</svg>
