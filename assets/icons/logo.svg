<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F5"/>
      <stop offset="1" stop-color="#FFF3F8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y2="1">
      <stop offset="0" stop-color="#CFA6D6"/>
      <stop offset="1" stop-color="#F7D1DC"/>
    </linearGradient>
    <linearGradient id="heartGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7D1DC"/>
      <stop offset="1" stop-color="#FFD8C2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#2E2B2B" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="96" fill="url(#bgGrad)" stroke="#F0E6E8" stroke-width="1" filter="url(#softShadow)"/>

  <!-- Decorative arc top -->
  <path d="M 50 70 Q 100 30 150 70" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- P letter stylized -->
  <text x="72" y="125" font-family="Playfair Display, Georgia, serif" font-weight="600" font-size="72" fill="#2E2B2B" opacity="0.85">p</text>

  <!-- Small heart accent -->
  <g transform="translate(130, 55) scale(0.4)">
    <path d="M 50 88 C 25 88 0 63 0 40 C 0 15 25 0 50 25 C 75 0 100 15 100 40 C 100 63 75 88 50 88 Z" fill="url(#heartGrad)" opacity="0.8"/>
  </g>

  <!-- Decorative dots -->
  <circle cx="55" cy="145" r="3" fill="#CFA6D6" opacity="0.5"/>
  <circle cx="70" cy="145" r="3" fill="#F7D1DC" opacity="0.5"/>
  <circle cx="85" cy="145" r="3" fill="#FFD8C2" opacity="0.5"/>
</svg>
