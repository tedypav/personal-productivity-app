<?xml version="1.0" encoding="UTF-8"?>
<svg width="340" height="600" viewBox="0 0 340 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#FFF8F5"/>
      <stop offset="1" stop-color="#FFF3F8"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#FFF9FB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#CFA6D6"/>
      <stop offset="1" stop-color="#F7D1DC"/>
    </linearGradient>
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#2E2B2B" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="340" height="600" fill="url(#bg)"/>

  <!-- Sidebar panel -->
  <rect x="8" y="8" width="324" height="584" rx="16" fill="url(#cardGrad)" stroke="#F0E6E8" filter="url(#softShadow)"/>

  <!-- Search bar -->
  <rect x="24" y="24" width="292" height="36" rx="18" fill="#FFF" stroke="#F0E6E8"/>
  <text x="44" y="47" font-family="Inter, Arial, sans-serif" font-size="13" fill="#9CA3AF">Search pages...</text>

  <!-- "+" buttons -->
  <circle cx="280" cy="42" r="14" fill="url(#accent)"/>
  <text x="275" y="47" font-family="Inter, Arial, sans-serif" font-size="16" fill="#FFFFFF">+</text>

  <!-- Upper tree: Pages -->
  <text x="24" y="86" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9CA3AF" font-weight="600" letter-spacing="0.5">PAGES</text>

  <!-- Folder: Projects -->
  <rect x="24" y="96" width="292" height="32" rx="8" fill="#FFF5F7"/>
  <text x="44" y="117" font-family="Inter, Arial, sans-serif" font-size="14" fill="#2E2B2B">&#128193; Projects</text>

  <!-- Page under Projects -->
  <rect x="40" y="132" width="276" height="28" rx="6" fill="transparent"/>
  <text x="60" y="151" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B6770">&#128196; Design System</text>

  <rect x="40" y="164" width="276" height="28" rx="6" fill="transparent"/>
  <text x="60" y="183" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B6770">&#128196; API Docs</text>

  <!-- Folder: Weekly -->
  <rect x="24" y="200" width="292" height="32" rx="8" fill="#FFF5F7"/>
  <text x="44" y="221" font-family="Inter, Arial, sans-serif" font-size="14" fill="#2E2B2B">&#128193; Weekly</text>

  <!-- Pages under Weekly -->
  <rect x="40" y="236" width="276" height="28" rx="6" fill="#F3E8F6" stroke="#CFA6D6" stroke-width="1"/>
  <text x="60" y="255" font-family="Inter, Arial, sans-serif" font-size="13" fill="#2E2B2B" font-weight="500">&#128196; 2026-06-09 - 2026-06-15</text>

  <rect x="40" y="268" width="276" height="28" rx="6" fill="transparent"/>
  <text x="60" y="287" font-family="Inter, Arial, sans-serif" font-size="13" fill="#6B6770">&#128196; 2026-06-02 - 2026-06-08</text>

  <!-- Page: Inbox -->
  <rect x="24" y="308" width="292" height="32" rx="8" fill="transparent"/>
  <text x="44" y="329" font-family="Inter, Arial, sans-serif" font-size="14" fill="#2E2B2B">&#128196; Inbox</text>

  <!-- Separator -->
  <line x1="24" y1="352" x2="316" y2="352" stroke="#F0E6E8" stroke-width="1"/>

  <!-- Lower tree: Special folders -->
  <text x="24" y="376" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9CA3AF" font-weight="600" letter-spacing="0.5">SPECIAL</text>

  <!-- Templates folder -->
  <rect x="24" y="386" width="292" height="32" rx="8" fill="transparent"/>
  <text x="44" y="407" font-family="Inter, Arial, sans-serif" font-size="14" fill="#2E2B2B">&#128203; Templates</text>

  <!-- Archive folder -->
  <rect x="24" y="422" width="292" height="32" rx="8" fill="transparent"/>
  <text x="44" y="443" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6B6770">&#128451; Archive</text>

  <!-- Fun Imports folder -->
  <rect x="24" y="458" width="292" height="32" rx="8" fill="transparent"/>
  <text x="44" y="479" font-family="Inter, Arial, sans-serif" font-size="14" fill="#6B6770">&#127912; Fun Imports</text>

  <!-- Status bar -->
  <rect x="8" y="564" width="324" height="28" rx="0" fill="#FFFBFD"/>
  <line x1="8" y1="564" x2="332" y2="564" stroke="#F0E6E8" stroke-width="1"/>
  <text x="24" y="583" font-family="Inter, Arial, sans-serif" font-size="11" fill="#9CA3AF">12 pages</text>
</svg>
